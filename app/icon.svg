<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Terminal Window -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="3" />

  <!-- Top Terminal Titlebar -->
  <path d="M3.5 16C3.5 9.09644 9.09644 3.5 16 3.5H48C54.9036 3.5 60.5 9.09644 60.5 16V18H3.5V16Z" fill="#161b22" />
  <line x1="2" y1="18" x2="62" y2="18" stroke="#30363d" stroke-width="2" />

  <!-- Window Traffic Dots -->
  <circle cx="13" cy="11" r="2.6" fill="#ff5f56" />
  <circle cx="21.5" cy="11" r="2.6" fill="#ffbd2e" />
  <circle cx="30" cy="11" r="2.6" fill="#27c93f" />

  <!-- Prompt Chevron (>) in Terminal Green -->
  <path
    d="M16 29L28 38L16 47"
    stroke="#3fb950"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Terminal Cursor (_) in GitHub Cyan -->
  <line
    x1="34"
    y1="47"
    x2="48"
    y2="47"
    stroke="#58a6ff"
    stroke-width="6"
    stroke-linecap="round"
  />
</svg>

